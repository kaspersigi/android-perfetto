name: Release Android tracebox

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate release tracebox
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 make git curl ca-certificates tar xz-utils unzip binutils

      - name: Test build scripts
        run: make test

      - name: Build Release with four parallel jobs
        run: |
          # Perfetto installs the toolchain pinned by the selected source tag.
          # Do not substitute the runner's preinstalled NDK or GN/Ninja.
          make release JOBS=4
          make verify

      - name: Store verified build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracebox-release
          path: |
            dist/tracebox
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish tracebox to GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracebox-release
          path: dist

      - name: Verify downloaded release binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils
          # Artifact transport does not preserve executable permissions.
          chmod 0755 dist/tracebox
          make verify

      - name: Upload tracebox and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh

      # The Release is the durable copy; keep the one-day artifact expiry as
      # a fallback if publishing or cleanup fails. Rebuild to rerun after cleanup.
      - name: Verify published assets and remove temporary artifacts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS: |
            tracebox
        run: |
          set -euo pipefail
          trap 'echo "::warning::Artifact cleanup incomplete; remaining artifacts retain their one-day expiry."' ERR
          release_json="$RUNNER_TEMP/published-release-cleanup.json"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .published_at != null' "$release_json" > /dev/null
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            local_digest=$(sha256sum "dist/$asset")
            remote_digest=$(jq -er --arg name "$asset" \
              '.assets[] | select(.name == $name and .state == "uploaded") | .digest' "$release_json")
            if [[ "$remote_digest" != "sha256:${local_digest%% *}" ]]; then
              echo "::warning::Published asset digest mismatch: $asset; retaining workflow artifacts."
              exit 1
            fi
          done <<< "$RELEASE_ASSETS"
          # List completely before deletion so pagination cannot skip entries.
          artifact_ids=$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name == "tracebox-release")) | .id')
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
